models:
  primary: "claude-3-5-sonnet-20241022"
  fallback: "gpt-4o"
  providers:
    - anthropic
    - openai

langchain:
  enabled: true
  tracing:
    enabled: false
    endpoint: ""  # e.g., "https://api.smith.langchain.com"
    project: "x-agent2"
  callbacks:
    enabled: true

plugins:
  auto_load: true
  trusted_sources:
    - "./plugins"
    - "./workspace/custom-skills"
  allow_internet: false
  max_execution_time: 30

security:
  command_execution:
    allow_dangerous_commands: false
    max_concurrent_processes: 10
  file_access:
    restricted_paths:
      - "/etc"
      - "/root"
      - "/proc"
      - "/sys"
    allowed_extensions:
      - ".txt"
      - ".py"
      - ".js"
      - ".md"
      - ".json"
      - ".csv"
      - ".jpg"
      - ".png"

channels:
  web_ui:
    port: 8000
    cors_origins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
  dingtalk:
    enabled: false
    webhook_url: ""
  feishu:
    enabled: false
    app_id: ""
    app_secret: ""