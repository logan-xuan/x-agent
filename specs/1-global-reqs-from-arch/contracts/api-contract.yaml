# API 合约: x-agent2 AI 助手系统与 LangChain 集成

## 概述
本文档定义了 x-agent2 AI 助手系统的 API 合约，指定了聊天交互、会话管理、工具执行和插件管理的端点。该系统利用 LangChain 进行代理编排、工具管理和任务规划。

## 基础 URL
`http://localhost:8000/api/v1` (开发环境) 或您的部署域名

## 认证
使用系统中配置的 API 密钥进行 Bearer token 认证。

## 端点

### 聊天和对话管理

#### POST /chat
启动或继续与 AI 助手的对话。利用 LangChain 代理增强对话管理。

**请求体:**
```json
{
  "message": "用户消息内容",
  "session_id": "可选会话标识符",
  "model_override": "可选模型名称",
  "context": {
    "user_preferences": {},
    "recent_interactions": []
  },
  "use_langchain_agent": true
}
```

**响应:**
```json
{
  "response": "助手的响应",
  "session_id": "对话会话的标识符",
  "timestamp": "ISO 8601 时间戳",
  "usage": {
    "input_tokens": 15,
    "output_tokens": 42,
    "total_tokens": 57
  },
  "metadata": {
    "processing_time_ms": 1250,
    "model_used": "claude-3-5-sonnet-20241022",
    "langchain_trace_id": "LangChain 操作的可选跟踪 ID"
  }
}
```

**请求头:**
- `Authorization: Bearer {api_key}`
- `Content-Type: application/json`

#### GET /chat/history
检索会话的对话历史。

**查询参数:**
- `session_id`: 必需的会话标识符
- `limit`: 可选返回消息数量 (默认: 50, 最大值: 200)
- `offset`: 可选分页偏移量 (默认: 0)

**响应:**
```json
{
  "session_id": "会话标识符",
  "messages": [
    {
      "id": "消息ID",
      "sender": "user|assistant|system",
      "content": "消息内容",
      "timestamp": "ISO 8601 时间戳",
      "type": "text|image|file|tool_result",
      "langchain_metadata": {}  // LangChain 特定元数据
    }
  ],
  "pagination": {
    "total_count": 120,
    "returned_count": 50,
    "has_more": true
  }
}
```

#### DELETE /chat/session/{session_id}
删除对话会话及其历史记录。

**响应:**
```json
{
  "success": true,
  "message": "会话已成功删除"
}
```

### 文件操作

#### POST /files/upload
上传由 AI 助手处理的文件。

**请求:**
带文件字段的表单数据:
```
Content-Type: multipart/form-data
```
表单字段: `file` - 要上传的文件

**查询参数:**
- `session_id`: 可选关联的会话

**响应:**
```json
{
  "file_id": "上传文件的唯一标识符",
  "filename": "原始文件名",
  "size_bytes": 102400,
  "mime_type": "检测到的 MIME 类型",
  "upload_timestamp": "ISO 8601 时间戳",
  "analysis_result": "可选初始分析"
}
```

#### GET /files/{file_id}
下载先前上传的文件。

**响应:**
带有适当 Content-Type 头的二进制文件内容。

### 工具执行

#### POST /tools/execute
使用提供的参数执行特定工具。由 LangChain 工具系统驱动。

**请求体:**
```json
{
  "tool_name": "web-search|file-read|command-exec",
  "parameters": {
    "query": "搜索查询",
    "file_path": "/path/to/file",
    "command": "shell 命令"
  },
  "session_id": "可选会话标识符"
}
```

**响应:**
```json
{
  "result": "工具执行结果",
  "status": "success|failed|cancelled",
  "execution_time_ms": 150,
  "metadata": {
    "tool_used": "web-search",
    "parameters_used": {...}
  },
  "langchain_tool_call_id": "可选 LangChain 工具调用标识符"
}
```

### 任务规划和代理管理

#### POST /agents/plan
使用 LangChain 的规划功能为复杂任务生成计划。

**请求体:**
```json
{
  "goal": "要规划的总体目标",
  "context": "要考虑的当前上下文",
  "preferred_agents": ["researcher", "coder", "reviewer"],
  "constraints": ["约束或要求列表"]
}
```

**响应:**
```json
{
  "plan": [
    {
      "step": 1,
      "description": "步骤描述",
      "tool_needed": "tool_name 或 null",
      "agent_needed": "agent_role 或 null",
      "estimated_duration": 30
    }
  ],
  "status": "planned",
  "langchain_plan_id": "生成计划的标识符"
}
```

#### POST /agents/run
使用 LangChain 代理执行功能执行特定任务的代理。

**请求体:**
```json
{
  "agent_role": "researcher|coder|reviewer|custom",
  "task": "要执行任务的详细描述",
  "context": "任务的附加上下文",
  "session_id": "可选会话标识符"
}
```

**响应:**
```json
{
  "result": "代理执行的结果",
  "status": "completed|failed|in-progress",
  "execution_details": {
    "steps_executed": 3,
    "tools_used": ["web-search", "file-read"],
    "duration_ms": 1200
  },
  "langchain_agent_run_id": "代理执行的标识符"
}
```

### 记忆系统

#### POST /memory/store
在助手的记忆中存储信息。与 LangChain 的记忆系统接口同时使用我们的自定义存储。

**请求体:**
```json
{
  "user_id": "用户标识符",
  "content": "要记住的信息",
  "entry_type": "preference|fact|interaction|summary",
  "tags": ["可选", "标签"],
  "expiry_days": 30
}
```

**响应:**
```json
{
  "memory_id": "存储记忆的唯一标识符",
  "stored": true,
  "expires_at": "ISO 8601 时间戳"
}
```

#### POST /memory/search
搜索存储的记忆。与 LangChain 的检索机制兼容。

**请求体:**
```json
{
  "query": "搜索查询",
  "user_id": "用户标识符",
  "filters": {
    "entry_type": ["preference", "fact"],
    "tags": ["重要"],
    "date_range": {
      "start": "ISO 8601 时间戳",
      "end": "ISO 8601 时间戳"
    }
  },
  "limit": 10
}
```

**响应:**
```json
{
  "results": [
    {
      "memory_id": "记忆标识符",
      "content": "记忆内容",
      "entry_type": "preference",
      "relevance_score": 0.92,
      "created_at": "ISO 8601 时间戳",
      "tags": ["重要", "偏好"]
    }
  ],
  "total_results": 1,
  "query_processed": "处理的查询词"
}
```

### 插件管理

#### GET /plugins
列出所有可用插件。

**响应:**
```json
{
  "plugins": [
    {
      "id": "插件唯一ID",
      "name": "插件名称",
      "description": "插件描述",
      "version": "1.0.0",
      "author": "作者姓名",
      "enabled": true,
      "installed": true,
      "permissions_needed": ["file_read", "network_access"]
    }
  ]
}
```

#### POST /plugins/{plugin_id}/toggle
启用或禁用插件。

**请求体:**
```json
{
  "enabled": true
}
```

**响应:**
```json
{
  "plugin_id": "插件ID",
  "enabled": true,
  "message": "插件状态已成功更新"
}
```

### 会话管理

#### POST /sessions
创建新会话。可选择使用 LangChain 代理初始化。

**请求体:**
```json
{
  "user_id": "可选用户标识符",
  "session_name": "可选会话名称",
  "initial_context": {},
  "initialize_agent": true
}
```

**响应:**
```json
{
  "session_id": "新的会话标识符",
  "created_at": "ISO 8601 时间戳",
  "status": "active"
}
```

#### GET /sessions/{session_id}
获取有关特定会话的信息。

**响应:**
```json
{
  "session_id": "会话标识符",
  "user_id": "关联的用户ID",
  "started_at": "ISO 8601 时间戳",
  "last_interaction_at": "ISO 8601 时间戳",
  "message_count": 25,
  "status": "active",
  "context_summary": "会话上下文的简要摘要",
  "active_agent": "当前活跃代理(如果有)"
}
```

## 错误响应
所有错误响应都遵循以下格式:

```json
{
  "error": {
    "code": "ERROR_CODE",
    "message": "人类可读的错误消息",
    "details": "可选详细信息"
  }
}
```

## 常见错误代码
- `AUTHENTICATION_ERROR`: 无效或缺少 API 密钥
- `VALIDATION_ERROR`: 请求参数不符合要求
- `RESOURCE_NOT_FOUND`: 请求的资源不存在
- `RATE_LIMIT_EXCEEDED`: 在时间段内请求过多
- `TOOL_EXECUTION_ERROR`: 执行工具时发生错误
- `PLUGIN_ERROR`: 与插件功能相关的错误
- `LANGCHAIN_ERROR`: 与 LangChain 操作相关的错误
- `INTERNAL_ERROR`: 未指定的服务器端错误