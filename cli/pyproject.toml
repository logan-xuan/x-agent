[project]
name = "x-agent-cli"
version = "0.1.0"
description = "X-Agent CLI - 命令行交互端"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
x-agent = "cli.main:app"

[tool.setuptools.packages.find]
where = [".."]
include = ["cli", "cli.*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
